name: Feature Request
description: Suggest a new feature or improvement for GitCharm
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you're trying to solve, not just the solution — it helps us find the best approach.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What's the use case or pain point this feature would address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired functionality
      description: What would you like GitCharm to do?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this to you?
      options:
        - Low
        - Medium
        - High
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other tools that do this well.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, mockups, or links to similar features in other tools (e.g. JetBrains IDEs).
