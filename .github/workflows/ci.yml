name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

jobs:
  verify:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck host
        run: npm run typecheck

      - name: Typecheck webviews
        run: npm run typecheck:webview

      - name: Lint
        run: npm run lint

      # The English bundle is generated from the l10n.t() calls in src/ — fail if a PR
      # changed UI strings without committing the regenerated l10n/bundle.l10n.json.
      - name: Check l10n bundle is up to date
        shell: bash
        run: |
          set -euo pipefail
          npm run l10n:export
          if [ -n "$(git status --porcelain -- l10n)" ]; then
            git status --short -- l10n
            git diff -- l10n
            echo "::error::l10n/bundle.l10n.json is out of date — run 'npm run l10n:export' and commit the result."
            exit 1
          fi

      - name: Check translations
        run: npm run l10n:check
