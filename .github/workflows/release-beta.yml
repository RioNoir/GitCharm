name: Release Beta (GitHub only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build VSIX and publish beta GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          echo "tag=${VERSION}-beta" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck host
        run: npm run typecheck

      - name: Typecheck webviews
        run: npm run typecheck:webview

      - name: Package VSIX
        run: |
          mkdir -p dist
          npm run package -- --out "dist/gitcharm-${{ steps.release_tag.outputs.tag }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: gitcharm-beta-vsix
          path: dist/*.vsix
          if-no-files-found: error

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Find the previous beta tag (exclude the current one)
          PREV_TAG="$(git tag --sort=-creatordate --list '*-beta' | grep -v "^${RELEASE_TAG}$" | head -1)"

          if [ -z "${PREV_TAG}" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          COMMITS="$(git log "${RANGE}" --no-merges --pretty=format:"%s" \
            | grep -v '^chore: bump version' || true)"

          if [ -z "${COMMITS}" ]; then
            echo "notes=No changes." >> "$GITHUB_OUTPUT"
            NOTES_FILE="/tmp/release-notes.md"
            echo "_No changes._" > "${NOTES_FILE}"
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES_FILE="/tmp/release-notes.md"
          > "${NOTES_FILE}"

          append_section() {
            local title="$1"; local prefix="$2"
            local lines
            lines="$(echo "${COMMITS}" | grep -E "^${prefix}" | sed "s/^${prefix}[^:]*: /- /" || true)"
            if [ -n "${lines}" ]; then
              printf "### %s\n%s\n\n" "${title}" "${lines}" >> "${NOTES_FILE}"
            fi
          }

          append_section "Features"      "feat"
          append_section "Bug Fixes"     "fix"
          append_section "Performance"   "perf"
          append_section "Refactoring"   "refactor"
          append_section "Documentation" "docs"
          append_section "Chores"        "chore"

          OTHER="$(echo "${COMMITS}" | grep -Ev "^(feat|fix|perf|refactor|docs|chore|test|style|ci|build)[(:!]" \
            | sed 's/^/- /' || true)"
          if [ -n "${OTHER}" ]; then
            printf "### Other\n%s\n\n" "${OTHER}" >> "${NOTES_FILE}"
          fi

          if [ -n "${PREV_TAG}" ]; then
            REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            printf "**Full diff**: %s/compare/%s...%s\n" "${REPO}" "${PREV_TAG}" "${RELEASE_TAG}" >> "${NOTES_FILE}"
          fi

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish beta GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail

          # Re-running for the same version replaces the existing beta release/asset instead of failing.
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag
          fi

          gh release create "${RELEASE_TAG}" dist/*.vsix \
            --title "GitCharm ${RELEASE_TAG}" \
            --notes-file "${NOTES_FILE}" \
            --prerelease \
            --target beta
